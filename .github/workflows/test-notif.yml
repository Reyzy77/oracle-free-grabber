name: Test notification

# Workflow jetable : verifie que l'issue creee par le bot declenche bien
# un e-mail. A supprimer une fois le test concluant.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create a test issue as the bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "@${{ github.repository_owner }} ceci est un **test de notification**."
            echo
            echo "Aucune machine n'a ete obtenue. Cette issue est creee par le bot,"
            echo "exactement comme le fera le grabber en cas de succes."
            echo
            echo '```'
            echo "shape=VM.Standard.A1.Flex"
            echo "ocpus=4.0"
            echo "memory_gb=24.0"
            echo "public_ip=xxx.xxx.xxx.xxx"
            echo '```'
            echo
            echo "Si tu recois ceci par e-mail, la notification fonctionne."
          } > body.md
          gh issue create \
            --title "[TEST] Notification envoyee par le bot" \
            --body-file body.md \
            --assignee "${{ github.repository_owner }}"
